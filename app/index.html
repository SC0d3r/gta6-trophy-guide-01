<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leonida 100% | Trophy Field Ledger</title>
<meta name="viewport" content="width=1280">
<meta name="description" content="An offline field ledger for the 55 trophies of Grand Theft Auto VI: the official list, a roadmap to the platinum, a watch list and cited guides.">
<link rel="stylesheet" href="style.css">
</head>
<body class="view-ledger">

<div class="top-rule" aria-hidden="true"></div>

<header class="audit" id="audit">
  <p class="audit-row audit-main" id="audit-main"></p>
  <p class="audit-row audit-sub" id="audit-sub"></p>
</header>

<main class="stage" id="stage">

  <aside class="rail" id="rail" aria-label="Ledger rail">
    <div class="masthead">
      <h1 class="wordmark">LEONIDA <span class="wordmark-accent">100%</span></h1>
      <p class="wordmark-sub">FIELD LEDGER</p>
    </div>

    <section class="progress" id="progress" aria-label="Progress">
      <div class="ring" id="ring"></div>
      <div class="progress-copy">
        <p class="progress-line" id="progress-line"></p>
        <p class="progress-open" id="progress-open"></p>
      </div>
    </section>

    <ul class="tallies" id="tallies" aria-label="Grade tallies"></ul>

    <nav class="nav" id="nav" aria-label="Views">
      <button class="nav-row" type="button" data-act="view" data-view="ledger" id="nav-ledger">
        <span>LEDGER</span><span class="nav-count" data-count="ledger"></span>
      </button>
      <button class="nav-row" type="button" data-act="view" data-view="roadmap" id="nav-roadmap">
        <span>ROADMAP</span><span class="nav-count" data-count="roadmap"></span>
      </button>
      <button class="nav-row" type="button" data-act="view" data-view="watch" id="nav-watch">
        <span>WATCH LIST</span><span class="nav-count" data-count="watch"></span>
      </button>
      <button class="nav-row" type="button" data-act="view" data-view="sources" id="nav-sources">
        <span>SOURCES</span><span class="nav-count" data-count="sources"></span>
      </button>
    </nav>

    <section class="filters" id="filters" aria-label="Filters">
      <div class="filter-row">
        <p class="filter-label">KIND</p>
        <div class="chips" id="chips-kind"></div>
      </div>
      <div class="filter-row">
        <p class="filter-label">GRADE</p>
        <div class="chips" id="chips-grade"></div>
      </div>
    </section>

    <section class="io" aria-label="Export and import">
      <div class="io-buttons">
        <button class="io-btn" type="button" data-act="export" id="export">Export</button>
        <button class="io-btn" type="button" data-act="import" id="import">Import</button>
      </div>
      <input class="io-file" type="file" id="import-file" accept="application/json,.json">
      <p class="io-status" id="io-status"></p>
    </section>

    <section class="spoiler" aria-label="Spoiler shield">
      <button class="switch" type="button" id="spoiler" role="switch" aria-checked="true" data-act="spoiler">
        <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
        <span class="switch-label">SPOILER SHIELD</span>
      </button>
      <p class="switch-note">hides story names until earned</p>
    </section>

    <footer class="rail-foot">
      <p class="kind-line" id="kind-line"></p>
      <p class="offline-line">Offline. Progress stays in this browser.</p>
    </footer>
  </aside>

  <section class="ledger" id="ledger" aria-label="The ledger">
    <header class="ledger-head" id="ledger-head">
      <div class="head-line">
        <h2 class="head-title">THE LEDGER</h2>
        <span class="head-count" id="ledger-count"></span>
        <label class="search" for="search">
          <span class="search-label">SEARCH</span>
          <input class="search-input" type="search" id="search" placeholder="name or description" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <p class="head-active" id="head-active"></p>
    </header>
    <div class="ledger-scroll" id="ledger-scroll">
      <div class="rows" id="rows" role="list"></div>
    </div>
    <p class="ledger-foot" id="ledger-foot"></p>
  </section>

  <section class="panel" id="panel" aria-live="polite" aria-label="Detail"></section>

</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
